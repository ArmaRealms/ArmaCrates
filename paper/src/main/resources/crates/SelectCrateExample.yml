Crate:
  # Type of crate -> SelectCrate allows players to choose their prize
  # See the wiki for detailed documentation: https://docs.crazycrew.us/crazycrates/home
  CrateType: SelectCrate
  # Name of the Inventory if a GUI crate.
  CrateName: '&6&lSelect Crate'
  # The name of the inventory that will be in the preview GUI.
  Preview-Name: '&6Select Crate Preview'
  # Starting amount of keys when the player 1st joins.
  StartingKeys: 0
  # Default key cost per selected prize. A prize-level RequiredKeys overrides this value.
  # Keys are consumed only when the player confirms their selection.
  RequiredKeys: 1
  # Max amount of crates that can be opened at once using /cc mass-open
  Max-Mass-Open: 10
  # If the crate shows in the /cc GUI.
  InGUI: true
  # Slot the item is in the GUI.
  Slot: 14
  # Enables/Disables the broadcast. Reward placeholders delay it until prize delivery.
  OpeningBroadCast: true
  # With %reward% or %prize%, announce each redeemed prize instead of the opening.
  BroadCast: '%prefix%&6%player% &7received &r%reward% &7from &6%crate%&7.'
  # SelectCrate specific configuration
  SelectCrate:
    # Maximum distinct prizes selected per confirmation. Omitted: 5. Minimum: 1.
    # The combined key cost must also fit the player's balance.
    MaxSelections: 5
    GUI:
      # Size of the selection GUI (must be a multiple of 9, max 54)
      Size: 54
      # Title shown at the top of the selection GUI
      Title: '&6Select Your Prize!'
    # Confirm button settings
    Confirm:
      # Control slots must be distinct and inside the reserved bottom row.
      Slot: 49
      Item:
        # Material of the confirm button
        Material: LIME_CONCRETE
        # Display name of the confirm button
        Name: '&aConfirm Choice'
        # Lore shown when hovering over the confirm button
        Lore:
          - '&7Click to receive all selected prizes.'
    # Closing the menu also cancels without consuming keys.
    Cancel:
      Slot: 53
    # Pagination controls are displayed when the crate has more prizes than fit on one page.
    # Keep these buttons beside Confirm and inside the reserved bottom row.
    Navigation:
      Previous:
        Slot: 48
        Item:
          Material: ARROW
          Name: '&ePrevious Page'
          Lore:
            - '&7Current page: %page% of %pages%'
      Next:
        Slot: 50
        Item:
          Material: ARROW
          Name: '&aNext Page'
          Lore:
            - '&7Current page: %page% of %pages%'
    # Visual marker for selected prizes. Click again to deselect.
    SelectionMarker:
      # Name added to lore when item is selected
      Name: '&e&l✓ SELECTED'
    # Replaces the prize icon when the player has a BlackListed-Permissions permission.
    # Uses the existing blacklist behavior: OP players bypass this restriction.
    BlockedPrize:
      Material: STRUCTURE_VOID
      Name: '&cPrêmio indisponível'
      Lore:
        - '&7Você não pode selecionar este prêmio.'
    # Custom messages
    Messages:
      # Message shown when player tries to confirm without selecting a prize
      NoSelection: '&cSelecione ao menos um produto antes de confirmar!'
      Counter: '&eSelecionados: %selected%/%max% | Chaves: %cost%/%keys%'
      Cancel: '&cCancelar'
      SelectionLimit: '&cVocê não possui chaves suficientes para esta seleção. Desmarque outro produto.'
      Unavailable: '&cSaldo insuficiente. Desmarque outro produto.'
      PrizeCost: '&7Custo: %cost% chave(s).'
      MaxSelections: '&cVocê pode selecionar no máximo %max% prêmios.'
      BlockedPrize: '&cVocê não pode selecionar este prêmio.'
      InventoryFull: '&cVocê não possui espaço suficiente no inventário para receber todos os produtos selecionados.'
      InvalidReward: '&cNão foi possível preparar os produtos. Avise a equipe.'
  # Item the crate is in the GUI
  Item: 'ENDER_CHEST'
  # If the crate in the main /cc GUI is glowing or not.
  Glowing: true
  # Name of the item in the GUI.
  Name: '&6&lSelect Crate'
  # The lore of the item in the GUI.
  Lore:
    - '&7Choose your own prize!'
    - '&7You have &6%keys% keys &7to open this crate.'
    - '&7You have opened this crate: &6%crate_opened% times'
    - '&7&l(&e&l!&7&l) Right-click to view rewards.'
  Preview:
    # Turn on and off the preview for this crate.
    Toggle: true
    # How many lines the Crate Preview should have. Including Header and Bottom (Between 3 and 6)
    ChestLines: 6
    Glass:
      # Turn the glass border in the preview on and off.
      Toggle: true
      # The name of the border item.
      Name: ' '
      # The item that shows in the border.
      Item: 'YELLOW_STAINED_GLASS_PANE'
  PhysicalKey:
    # Name of the Key.
    Name: '&6&lSelect Crate &e&lKey'
    # Lore of the Key.
    Lore:
      - '&7A special key'
      - '&7that lets you choose your prize!'
    # The item the key is.
    Item: 'TRIPWIRE_HOOK'
    # Makes the key look enchanted.
    Glowing: true
  # Settings for the holograms.
  Hologram:
    # Toggle on and off the holograms for the crates.
    Toggle: true
    # The height of the hologram above the crate.
    Height: 1.5
    # The distance the hologram can be seen.
    Range: 8
    # The message that will be displayed.
    Message:
      - '&6&lSelect Crate'
      - '&eChoose your prize!'
  # All the prizes that can be won from the Crate.
  # Choose distinct prizes across pages while their combined key cost fits your balance.
  # Prefer Items (including or: custom items) for validated inventory delivery.
  # Commands run after delivery and cannot be checked for space or rolled back.
  Prizes:
    1:
      # Optional override: this prize costs 2 keys even though the crate default is 1.
      RequiredKeys: 2
      DisplayName: '&e&lDiamond Sword'
      DisplayItem: 'DIAMOND_SWORD'
      DisplayAmount: 1
      Lore:
        - '&7A powerful diamond sword!'
        - '&7Perfect for combat.'
      # Players with any listed permission cannot select this reward, even with Alternative-Prize.
      # Example: ['crazycrates.claimed.select_sword']. Grant the permission through your reward setup.
      BlackListed-Permissions: []
      # For SelectCrate, MaxRange and Chance are not used
      # All prizes are available for selection
      MaxRange: 100
      Chance: 100
      # Items given to the player
      Items:
        - 'Item:DIAMOND_SWORD, Amount:1, Damage:0, Name:&c&lWarrior Sword, Enchantments:DAMAGE_ALL-5:FIRE_ASPECT-2'
    2:
      DisplayName: '&b&lDiamond Armor Set'
      DisplayItem: 'DIAMOND_CHESTPLATE'
      DisplayAmount: 1
      Lore:
        - '&7A full set of diamond armor!'
        - '&7Protect yourself in style.'
      MaxRange: 100
      Chance: 100
      Items:
        - 'Item:DIAMOND_HELMET, Amount:1, Damage:0, Enchantments:PROTECTION_ENVIRONMENTAL-4'
        - 'Item:DIAMOND_CHESTPLATE, Amount:1, Damage:0, Enchantments:PROTECTION_ENVIRONMENTAL-4'
        - 'Item:DIAMOND_LEGGINGS, Amount:1, Damage:0, Enchantments:PROTECTION_ENVIRONMENTAL-4'
        - 'Item:DIAMOND_BOOTS, Amount:1, Damage:0, Enchantments:PROTECTION_ENVIRONMENTAL-4'
    3:
      DisplayName: '&6&l64 Gold Ingots'
      DisplayItem: 'GOLD_INGOT'
      DisplayAmount: 64
      Lore:
        - '&7A full stack of gold bars!'
        - '&7Get rich instantly.'
      MaxRange: 100
      Chance: 100
      Items:
        - 'Item:GOLD_INGOT, Amount:64'
    4:
      DisplayName: '&a&lMoney Bundle'
      DisplayItem: 'EMERALD'
      DisplayAmount: 32
      Lore:
        - '&7Receive $10,000!'
        - '&7Perfect for starting your business.'
      MaxRange: 100
      Chance: 100
      Commands:
        - 'eco give %player% 10000'
      Messages:
        - '&aYou received $10,000!'
    5:
      DisplayName: '&d&lEnchanted Book'
      DisplayItem: 'ENCHANTED_BOOK'
      DisplayAmount: 1
      Lore:
        - '&7A rare enchanted book!'
        - '&7Fortune III'
      MaxRange: 100
      Chance: 100
      Items:
        - 'Item:ENCHANTED_BOOK, Amount:1, Stored-Enchantments:LOOT_BONUS_BLOCKS-3'
    6:
      DisplayName: '&c&lRare Potion'
      DisplayItem: 'POTION'
      DisplayAmount: 3
      Lore:
        - '&7Strength II potions!'
        - '&7Get stronger.'
      MaxRange: 100
      Chance: 100
      Items:
        - 'Item:POTION, Amount:3, PotionType:STRENGTH, Level:2'
    7:
      # Requires Oraxen. Replace example_sword in DisplayItem and Items with an existing Oraxen item ID.
      DisplayName: '&6&lOraxen Sword (Example)'
      DisplayItem: 'or:example_sword'
      DisplayAmount: 1
      Lore:
        - '&7An example reward using an Oraxen item.'
        - '&7Receives the item through the native inventory delivery.'
      MaxRange: 100
      Chance: 100
      Items:
        - 'Item:or:example_sword, Amount:1'
